name: deck

# Publishes the presentation (apps/deck) to GitHub Pages.
# Enable once in the repo: Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches: [master, main]
    paths: ["apps/deck/**", ".github/workflows/deck.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version-file: package.json }
      - run: bun install --frozen-lockfile
      - name: Build the slides for /<repository>/
        working-directory: apps/deck
        run: bunx slidev build --base /${{ github.event.repository.name }}/ --out dist
      - uses: actions/upload-pages-artifact@v3
        with: { path: apps/deck/dist }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
