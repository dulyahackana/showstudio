name: ci

on:
  push: { branches: [main] }
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version-file: package.json }
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - name: Contracts and conformance vectors are committed and current
        run: |
          bun run gen:contracts
          bun run gen:vectors
          git diff --exit-code contracts test-vectors
      - name: Unit, property, conformance and API end-to-end tests
        run: bun run test
      - run: bun run build

  e2e:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version-file: package.json }
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
        working-directory: apps/editor
      - run: bun run e2e
        env: { CI: "1" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright
          path: |
            apps/editor/playwright-report
            apps/editor/test-results

  godot:
    runs-on: ubuntu-latest
    needs: checks
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version-file: package.json }
      - run: bun install --frozen-lockfile
      - name: Install Godot (headless)
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d "$RUNNER_TEMP/godot"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Godot port reproduces the conformance vectors
        run: bun run test:godot
      - name: Godot simulator as the attraction (deploy, launch, sensor, e-stop)
        run: bun run e2e:godot

  image:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: { context: ., target: runtime, push: false, load: true, tags: "show-studio:${{ github.sha }}" }
      - name: Scan image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          {
            image-ref: "show-studio:${{ github.sha }}",
            severity: "CRITICAL,HIGH",
            exit-code: "1",
            ignore-unfixed: true,
          }
